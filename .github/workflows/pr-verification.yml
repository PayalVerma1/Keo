name: KEO PR verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  verify:
    # Verification credentials are deliberately unavailable to untrusted fork PRs.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEO_API_URL: ${{ secrets.KEO_API_URL }}
      KEO_VERIFICATION_TOKEN: ${{ secrets.KEO_VERIFICATION_TOKEN }}
      KEO_SERVICE_ID: ${{ vars.KEO_SERVICE_ID }}
      KEO_BASELINE_SERVICE_ID: ${{ vars.KEO_BASELINE_SERVICE_ID }}
      KEO_PR_NUMBER: ${{ github.event.pull_request.number }}
      KEO_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate KEO configuration
        run: |
          test -n "$KEO_API_URL"
          test -n "$KEO_VERIFICATION_TOKEN"
          test -n "$KEO_SERVICE_ID"
          test -n "$KEO_BASELINE_SERVICE_ID"

      - name: Create verification job
        id: create
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --request POST "$KEO_API_URL/api/verifications" \
            --header "content-type: application/json" \
            --header "x-keo-verification-token: $KEO_VERIFICATION_TOKEN" \
            --data "{\"repository\":\"${{ github.repository }}\",\"commitSha\":\"$KEO_SHA\",\"pullRequestNumber\":$KEO_PR_NUMBER,\"serviceId\":\"$KEO_SERVICE_ID\",\"baselineServiceId\":\"$KEO_BASELINE_SERVICE_ID\"}")
          echo "job_id=$(echo "$response" | jq -r .jobId)" >> "$GITHUB_OUTPUT"

      - name: Build PR image in an isolated Docker sandbox
        run: docker build --target test --tag "keo-pr:${KEO_SHA}" .

      - name: Run application traffic and tests
        env:
          KEO_VERIFICATION_JOB_ID: ${{ steps.create.outputs.job_id }}
        # Replace this repository variable with the command that starts your PR app,
        # exercises it, and emits SDK telemetry to KEO_API_URL.
        run: ${{ vars.KEO_PR_TEST_COMMAND || 'docker run --rm "keo-pr:${KEO_SHA}" pnpm run build' }}

      - name: Close telemetry window
        if: success()
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            "$KEO_API_URL/api/verifications/${{ steps.create.outputs.job_id }}/complete" \
            --header "x-keo-verification-token: $KEO_VERIFICATION_TOKEN"

      - name: Wait for verification report
        if: success()
        id: report
        run: |
          for attempt in {1..36}; do
            response=$(curl --fail-with-body --silent --show-error \
              "$KEO_API_URL/api/verifications/${{ steps.create.outputs.job_id }}" \
              --header "x-keo-verification-token: $KEO_VERIFICATION_TOKEN")
            status=$(echo "$response" | jq -r .status)
            if [[ "$status" =~ ^(PASSED|WARNING|FAILED|ERROR)$ ]]; then
              echo "status=$status" >> "$GITHUB_OUTPUT"
              echo "summary=$(echo "$response" | jq -r '.report.summary // "Verification completed"')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "Verification report timed out" >&2
          exit 1

      - name: Publish PR summary
        if: always() && steps.report.outputs.status != ''
        uses: actions/github-script@v7
        env:
          VERIFICATION_STATUS: ${{ steps.report.outputs.status }}
          VERIFICATION_SUMMARY: ${{ steps.report.outputs.summary }}
        with:
          script: |
            const body = `## KEO verification: ${process.env.VERIFICATION_STATUS}\n\n${process.env.VERIFICATION_SUMMARY}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on verification regression
        if: steps.report.outputs.status == 'FAILED' || steps.report.outputs.status == 'ERROR'
        run: exit 1
