# Isolated PR sandbox: the pull-request application plus test Postgres and Redis.
# GitHub Actions builds `keo-pr:$KEO_SHA` from the sandbox Docker target, then
# starts this stack, waits for the health check, and runs traffic against the app.
name: keo-pr-sandbox

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keo
      POSTGRES_USER: keo
      POSTGRES_PASSWORD: keo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keo -d keo"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sandbox

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - sandbox

  migrate:
    image: keo-pr:${KEO_SHA}
    command: pnpm exec prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://keo:keo@postgres:5432/keo?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sandbox

  app:
    image: keo-pr:${KEO_SHA}
    environment:
      DATABASE_URL: postgresql://keo:keo@postgres:5432/keo?schema=public
      REDIS_CLIENT: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-pr-sandbox-secret}
      NEXTAUTH_URL: http://127.0.0.1:3000
      JWT_SECRET: ${JWT_SECRET:-pr-sandbox-jwt}
      KEO_API_URL: ${KEO_API_URL:-}
      KEO_VERIFICATION_JOB_ID: ${KEO_VERIFICATION_JOB_ID:-}
      KEO_SERVICE_ID: ${KEO_SERVICE_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - sandbox

networks:
  sandbox:
    driver: bridge
